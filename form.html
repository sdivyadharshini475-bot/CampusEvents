<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Events</title>
    <link rel="stylesheet" href="form.css">
    <link rel="icon" href="https://tse4.mm.bing.net/th/id/OIP.AuIH6LuKZ5DzhwdY6he1igHaEc?r=0&pid=Api&h=220&P=0">
</head>
<body>
    <h1>Register for Event</h1>
    <label for="Name">Name:</label>
    <input type="text"
    id="Name"
    placeholder="Enter your name"
    minlength="3"
    maxlength="40"
    >
    <br></br>
    <label for="Email">Email:</label>
    <input type="text"
    id="Email"
    placeholder="Enter your email"
    minlength="3"
    maxlength="40"
    >
    <br></br>
    <label for="event">Choose an event:</label>
    <select id="event" name="event">
        <option value="">Events</option>
        <option value="tech">Tech workshop</option>
        <option value="design">Design day</option>
    </select>
    <br></br>
    <button type="submit">submit</button>
</body>
</html>
