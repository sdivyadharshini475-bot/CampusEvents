
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events and Forms</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f7fb;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }
        input {
            display: block;
            width: 95%;
            padding: 10px;
            margin: 10px 0;
        }
        button {
            padding: 10px 15px;
            background-color: teal;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        .event-card {
            border: 1px solid #ccc;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }
        #error {
            color: red;
        }

        #feedback {
            color: green;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Events and Forms</h1>
    <h2>Task 1: Click Event</h2>
    <button id="status-btn">Click Me</button>
    <p id="status">Waiting for button click...</p>
    <h2>Task 2: Character Count</h2>
    <input type="text" id="message" placeholder="Type something">
    <p>Character count: <span id="count">0</span></p>
    <h2>Task 3: Registration Form</h2>
    <form id="registration-form">
        <input type="text" id="name" placeholder="Enter your name">
        <input type="email" id="email" placeholder="Enter your email">
        <button type="submit">Register</button>
    </form>
    <p id="error"></p>
    <p id="feedback"></p>
    <h2>Task 4: Campus Events</h2>
    <div id="event-list"></div>
    <p id="join-status"></p>
</div>
<script src="module12.js"></script>
</body>
</html>
